# Github Actions 每日自动同步跟随更新
# 规则提供者: https://github.com/MetaCubeX/meta-rules-dat
rule-providers:
  自定义规则: # 主要用于广告/业务误杀自定义放行
    <<: *Local
    path: ./etc/自定义规则.list
  WebRTC_端/域:
    <<: *Classical
    path: ./rules/WebRTC.list
