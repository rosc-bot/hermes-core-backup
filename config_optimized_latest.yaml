      - ALL·日本地区
      - ALL·荷兰地区
      - ALL·韩国地区
      - ALL·狮城地区
      - ALL·其它地区
      - ⛔️ 禁止·拒绝连接
      - 🌐 本机·本地直连
    <<: *A
