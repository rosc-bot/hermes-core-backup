# 最后更新于 SurfingTile：2026-08-29 13:50:53
# —————————
# ==== Tips
# 1. 修改配置文件保存时，需要重启服务/重载配置以生效.
# 2. 如使用 SurfingTile 的配置覆写，当前配置文件的某些字段应保持原有的完整性结构，只新增不改旧原则
# 3. “proxy-groups” 该代理组 “总模式” 位于 SurfingTile 覆写匹配字段，多语言用户可更改 “name” 为 "TotalMode","Total Mode","GlobalMode","Global Mode","Общий режим" 支持大小写。或者使用图标URL “/All.svg” 对该组覆写

# 基础设置
mixed-port: 7890
redir-port: 7891
tproxy-port: 1536
ipv6: false
mode: Rule
allow-lan: false
disable-keep-alive: false
keep-alive-interval: 60
keep-alive-idle: 60
tfo: true
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
updatetime: &Time 43200
geox-url:
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
unified-delay: true
tcp-concurrent: true
log-level: silent
find-process-mode: always
experimental:
  quic-go-disable-gso: true

# 阿里 NTP 时间同步（解决手机/模块时间偏差导致握手失败）
ntp:
  enable: true
  server: 'ntp.aliyun.com'
  write-to-system: false

external-controller: 0.0.0.0:9090
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-ui: "./webroot/Zash/"
secret: ""
# 声明 TLS 指纹锚点（解决 SurfingTile 配置覆写报错）
proxy_fp: &proxy_fp
  client-fingerprint: chrome

# —————————
# 健康检查（增加懒测速 lazy + 容差 tolerance + 故障阈值，省流防卡顿抖动）
p: &p
  type: http
  interval: *Time
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true
  proxy: 订阅更新
  header:
      User-Agent:
        - "Mihomo"
        - "clash-verge/v2.2.3"
        - "ClashforWindows/0.19.23"
        - "clash.meta"
        - "mihomo"
# —————————
# 订阅地址相关
A: &A
  filter: "^(?!.*(套餐|重置|剩余|到期|订阅|群|账户|流量|有效期|时间|官网|失联|余额)).*$"
  use:
  - "CF"
  - "星河"
  - "聚合"
  - "甲骨云"
  - "🐔"
All: &All
  type: url-test
  interval: 600
  lazy: true
  timeout: 3000
  tolerance: 50
  max-failed-times: 3
  url: 'https://www.gstatic.com/generate_204'
  use:
  - "CF"
  - "星河"
  - "聚合"
  - "甲骨云"
  - "🐔"
proxy-providers:
  "CF":
    <<: *p
    override:
      additional-prefix: "CF"
      <<: *proxy_fp
    path: "./proxies/CF.yaml"
    url: "https://985224.xyz/sub?token=b45a27c77026e939925e764089a24e4f"
  "星河":
    <<: *p
    override:
      additional-prefix: "星河"
      <<: *proxy_fp
    path: "./proxies/星河.yaml"
    url: "https://q4cev.eduk.cc.cd/s/eyJ1Ijoi5aaC5piUIiwiZSI6MTc4NTgxMDkxNjM0MywicyI6IjI5NzIyYzI1NmVkMjBlZmUifQ"
  "聚合":
    <<: *p
    override:
      additional-prefix: "聚合"
      <<: *proxy_fp
    path: "./proxies/聚合.yaml"
    url: "https://sub.996878.xyz/sub/LJlNOapVwHXPtudHgMl93rVKGWgHvx1S"
  "甲骨云":
    <<: *p
    override:
      additional-prefix: "甲骨云"
      <<: *proxy_fp
    path: "./proxies/甲骨云.yaml"
    url: "http://54.180.241.21:3001/download/%E7%94%B2%E9%AA%A8%E6%96%87%E6%96%B0%E5%8A%A0%E5%9D%A1?target=ClashMeta"
  "🐔":
    <<: *p
    override:
      additional-prefix: "🐔"
      <<: *proxy_fp
    path: "./proxies/🐔.yaml"
    url: "http://54.180.241.21:3001/download/aws-jp?target=ClashMeta"
profile:
  store-selected: true
  store-fake-ip: false
# —————————
# 嗅探模块 (redir-host 核心：精准嗅探 + 强制覆盖目标域名，解决 403 阻断)
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 5228, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
    - "+.openai.com"
    - "+.oaistatic.com"
    - "+.oaiusercontent.com"
    - "+.anthropic.com"
    - "+.claude.ai"
    - "+.generativeai.google"
    - "+.ai.google.dev"
    - "+.cloudflare.com"
  skip-domain: # 排除小米及各系统 Wi-Fi 验证域名，防止连公共网络无弹窗
    - "+.io.mi.com"
    - "captive.apple.com"
    - "connectivitycheck.gstatic.com"
# —————————
# 网卡模块 (保持兼容应用黑白名单)
tun:
  enable: false
  device: Meta
  stack: gvisor
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  exclude-package: []
# —————————
# Host (DoH 服务器 IP 预解析，解决 DNS 递归解析死锁与冷启动断网)
hosts:
  services.googleapis.cn: services.googleapis.com
  'dns.alidns.com': ['223.5.5.5', '223.6.6.6']
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'cloudflare-dns.com': ['1.1.1.1', '1.0.0.1']
  'dns.google': ['8.8.8.8', '8.8.4.4']
  'dns.quad9.net': ['9.9.9.9', '149.112.112.112']
# —————————
# DNS模块 (完美兼容应用包名黑白名单，加入 ARC 智能缓存，补齐引导 DNS)
dns:
  enable: true
  ipv6: false
  respect-rules: true # 让 DNS 乖乖听从分流规则，绝不漏解析
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  enhanced-mode: redir-host
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 223.6.6.6
    - 1.12.12.12
  proxy-server-nameserver:
    - https://1.12.12.12:443/dns-query#🌐 本机·本地直连&h3=false
    - https://120.53.53.53:443/dns-query#🌐 本机·本地直连&h3=false
    - https://223.5.5.5:443/dns-query#🌐 本机·本地直连&h3=true
    - https://223.6.6.6:443/dns-query#🌐 本机·本地直连&h3=true
  nameserver-policy:
    "RULE-SET:CN_域":
      - https://1.12.12.12:443/dns-query#🌐 本机·本地直连&h3=false
      - https://120.53.53.53:443/dns-query#🌐 本机·本地直连&h3=false
      - https://223.5.5.5:443/dns-query#🌐 本机·本地直连&h3=true
      - https://223.6.6.6:443/dns-query#🌐 本机·本地直连&h3=true
    "RULE-SET:Microsoft_域":
      - https://1.12.12.12:443/dns-query#🌐 本机·本地直连&h3=false
      - https://120.53.53.53:443/dns-query#🌐 本机·本地直连&h3=false
      - https://223.5.5.5:443/dns-query#🌐 本机·本地直连&h3=true
      - https://223.6.6.6:443/dns-query#🌐 本机·本地直连&h3=true
    "RULE-SET:Apple_域":
      - https://1.12.12.12:443/dns-query#🌐 本机·本地直连&h3=false
      - https://120.53.53.53:443/dns-query#🌐 本机·本地直连&h3=false
      - https://223.5.5.5:443/dns-query#🌐 本机·本地直连&h3=true
      - https://223.6.6.6:443/dns-query#🌐 本机·本地直连&h3=true
  nameserver:
    - https://8.8.8.8:443/dns-query#DNS连接&h3=false
    - https://8.8.4.4:443/dns-query#DNS连接&h3=false
    - https://cloudflare-dns.com/dns-query#DNS连接&h3=false
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.12.12.12
    - 223.6.6.6
# —————————
proxies:
  - {name: 🌐 本机·本地直连, type: direct, udp: true}
  - {name: ⛔️ 禁止·拒绝连接, type: reject}
  - {name: 🌐 DNS_Hijack, type: dns}
proxy_groups: &proxy_groups
    type: select
    proxies:
      - 总模式
      - ALL·延迟最低
      - ALL·负载均衡
