services:
  telegram-group-monitor:
    build: .
    container_name: telegram-group-monitor
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./data/tg_monitor.session:/app/tg_monitor.session
      - ./data/tg_messages.db:/app/tg_messages.db
